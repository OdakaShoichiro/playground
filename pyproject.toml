[project]
name = "playground"
version = "0.1.0"
description = "Playground"
authors = [{ name = "Shoichieo Odaka", email = "odakas1994@gmail.com" }]
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
    "arch>=8.0.0",
    "armagarch>=1.0.4",
    "black>=25.12.0",
    "fastsom>=1.0.2",
    "huggingface-hub>=1.2.3",
    "ipyvuetable>=0.7.21",
    "jax>=0.8.2",
    "jupyter>=1.1.1",
    "jupyterlab-code-formatter>=3.0.2",
    "jupyterlab-language-pack-ja-jp>=4.4.post3",
    "jupyterlab-lsp>=5.2.0",
    "lightgbm>=4.6.0",
    "matplotlib-fontja>=1.1.0",
    "matplotlib>=3.10.8",
    "mecab-python3>=1.0.12",
    "mgarch>=0.3.0",
    "mvgarch>=1.2.4",
    "networkx>=3.6.1",
    "numpy>=2.4.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "patito>=0.8.5",
    "pingouin>=0.5.5",
    "plotly>=6.5.0",
    "polarify>=0.2.1",
    "polars-ds>=0.10.4",
    "polars>=1.36.1",
    "polugins>=0.5.1",
    "pyarrow>=22.0.0",
    "pymc>=5.26.1",
    "pyper>=1.1.2",
    "python-lsp-ruff>=2.3.0",
    "python-lsp-server>=1.14.0",
    "ruff-lsp>=0.0.62",
    "ruff>=0.14.10",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "shirokumas>=0.0.4",
    "statsmodels>=0.14.6",
    "sympy>=1.14.0",
    "tensorflow>=2.20.0",
    "torch>=2.9.1",
    "unidic-lite>=1.0.8",
    "xarray>=2025.12.0",
    "yfinance>=1.0",
]

[project.scripts]
hello = "workspace:playground"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/workspace"]
